# git-cliff computes the next release version from Conventional Commits.

[bump]
# This repository has no Git release tags yet. The first release workflow creates v0.1.1.
initial_tag = "v0.1.1"
# Use standard SemVer before and after 1.0.0.
features_always_bump_minor = true
breaking_always_bump_major = true

[changelog]
# Version calculation does not use this output, but git-cliff requires a valid changelog template.
header = "# Changelog\n\n"
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^docs", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^style", group = "Styling" },
  { message = "^test", group = "Testing" },
  { message = "^chore\\(release\\):", skip = true },
  { message = "^chore|^ci|^build", group = "Miscellaneous Tasks" },
  { body = ".*security", group = "Security" },
  { message = "^revert", group = "Revert" },
]
tag_pattern = "v[0-9].*"
filter_commits = false
topo_order = false
sort_commits = "oldest"
