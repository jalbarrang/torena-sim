name: Versioning

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Disable husky git hooks in CI: semantic-release's automated release commit
    # must not run local dev-only gates (knip/dupes/typecheck) that can fail the commit.
    env:
      HUSKY: '0'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.DATA_UPDATE_PAT }}
          GITHUB_TOKEN: ${{ secrets.DATA_UPDATE_PAT }}
        run: pnpm exec semantic-release
