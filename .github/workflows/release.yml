name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact SemVer already committed to Cargo.toml, without a v prefix"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
      - name: Resolve tag or main commit
        id: release
        run: |
          tag="v$VERSION"
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            echo "release_sha=$(git rev-list -n 1 "$tag")" >> "$GITHUB_OUTPUT"
          else
            test "$GITHUB_REF" = "refs/heads/main" || {
              echo "A new release must start from main" >&2
              exit 1
            }
            echo "release_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Verify v${{ inputs.version }}
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.release_sha }}
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: "24.11.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: swatinem/rust-cache@v2.9.2
      - name: Validate release input
        run: ./scripts/validate-release-version.sh "$VERSION"
      - name: Install pinned release tools
        run: |
          npm install --global npm@11.17.0
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-machete --version 0.9.2 --locked
          cargo install wasm-pack --version 0.15.0 --locked
      - name: Run full quality gates
        run: ./scripts/quality-gates.sh
      - name: Build deterministic npm package
        run: ./scripts/package-npm.sh
      - name: Dry-run crates.io package
        run: cargo package --locked -p honse-sim
      - name: Dry-run crates.io publish
        run: cargo publish --locked -p honse-sim --dry-run
      - name: Dry-run npm package
        working-directory: honse-sim-wasm/pkg
        run: npm pack --dry-run --json

  create_tag:
    name: Create immutable tag v${{ inputs.version }}
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      RELEASE_SHA: ${{ needs.resolve.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
      - name: Create or verify release tag
        run: |
          tag="v$VERSION"
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$tag")" = "$RELEASE_SHA" || {
              echo "$tag points to a different commit" >&2
              exit 1
            }
          else
            git tag "$tag" "$RELEASE_SHA"
            git push origin "refs/tags/$tag"
          fi

  publish_registries:
    name: Publish registries v${{ inputs.version }}
    needs: [resolve, create_tag]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
          ref: v${{ inputs.version }}
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: "24.11.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: swatinem/rust-cache@v2.9.2
      - name: Install pinned packaging tools
        run: |
          npm install --global npm@11.17.0
          cargo install wasm-pack --version 0.15.0 --locked
      - name: Rebuild release archives
        id: archives
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.resolve.outputs.release_sha }}"
          ./scripts/validate-release-version.sh "$VERSION"
          cargo package --locked -p honse-sim
          ./scripts/package-npm.sh
          npm_json=$(cd honse-sim-wasm/pkg && npm pack --json)
          npm_filename=$(python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["filename"])' <<<"$npm_json")
          echo "crate_archive=target/package/honse-sim-$VERSION.crate" >> "$GITHUB_OUTPUT"
          echo "npm_archive=honse-sim-wasm/pkg/$npm_filename" >> "$GITHUB_OUTPUT"
      - name: Verify registry state
        id: registry
        run: ./scripts/check-release-state.sh "$VERSION" "${{ steps.archives.outputs.crate_archive }}" "${{ steps.archives.outputs.npm_archive }}"
      - name: Require bootstrap token for the first crates.io release
        if: steps.registry.outputs.crate_exists_exact != 'true' && steps.registry.outputs.crate_exists_any != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || {
            echo "CRATES_IO_BOOTSTRAP_TOKEN is required for the first crates.io release" >&2
            exit 1
          }
      - name: Authenticate to crates.io with OIDC
        id: crates_auth
        if: steps.registry.outputs.crate_exists_exact != 'true' && steps.registry.outputs.crate_exists_any == 'true'
        uses: rust-lang/crates-io-auth-action@v1.0.5
      - name: Publish first crates.io release with bootstrap token
        if: steps.registry.outputs.crate_exists_exact != 'true' && steps.registry.outputs.crate_exists_any != 'true'
        run: cargo publish --locked -p honse-sim
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
      - name: Publish crates.io release with OIDC
        if: steps.registry.outputs.crate_exists_exact != 'true' && steps.registry.outputs.crate_exists_any == 'true'
        run: cargo publish --locked -p honse-sim
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token }}
      - name: Publish npm release with OIDC
        if: steps.registry.outputs.npm_exists_exact != 'true'
        working-directory: honse-sim-wasm/pkg
        run: npm publish --access public

  github_release:
    name: Create GitHub Release v${{ inputs.version }}
    needs: publish_registries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create release with generated notes
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$tag"
          fi
