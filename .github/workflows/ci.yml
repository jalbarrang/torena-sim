name: Rust CI

on:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "Cargo.toml"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "clippy.toml"
      - "deny.toml"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "**/*.rs"
      - "Cargo.toml"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "clippy.toml"
      - "deny.toml"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: "1 · Rustfmt"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt
      - run: cargo fmt --check

  deny:
    name: "2 · cargo-deny"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          manifest-path: Cargo.toml
          command: check

  machete:
    name: "2 · Unused dependencies"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: swatinem/rust-cache@v2.9.2
      - run: cargo install cargo-machete --version 0.9.2 --locked
      - run: cargo machete

  clippy:
    name: "3 · Clippy"
    needs: [fmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2.9.2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: "4 · Tests"
    needs: [clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: swatinem/rust-cache@v2.9.2
      - run: cargo test --locked --workspace

  check:
    name: "5 · Check and WASM build"
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown
      - uses: swatinem/rust-cache@v2.9.2
      - run: cargo check --locked --workspace --all-targets
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --locked -p honse-sim --no-deps
      - run: cargo build --locked -p honse-sim-wasm --target wasm32-unknown-unknown
