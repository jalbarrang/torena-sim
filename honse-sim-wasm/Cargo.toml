[package]
name = "honse-sim-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "WebAssembly adapter for the honse-sim race engine."

[lib]
# Preserve the npm package's existing generated filenames and JavaScript API.
name = "uma_sim_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
honse-sim = { path = "../honse-sim" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
